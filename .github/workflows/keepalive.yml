name: keepalive worker

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping-worker:
    runs-on: ubuntu-latest
    steps:
      - name: Pinger al worker (evita el sleep de Render Free)
        shell: bash
        run: |
          URL="${WORKER_URL%/}/status"
          if curl -fsS --max-time 25 -o /dev/null "$URL"; then
            echo "worker OK"
          else
            echo "usando indice (recien despierto)"
            curl -fsS --max-time 40 -o /dev/null "${WORKER_URL%/}/"
          fi
        env:
          WORKER_URL: ${{ vars.WORKER_URL }}

  warm-functions:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        fn: [rates, clients, settings, qr, auth]
    env:
      # Sin sesion, las funciones responden 401 pero la instancia queda caliente.
      FUN_URL: https://adelljptewdngtnljohu.supabase.co/functions/v1/${{ matrix.fn }}
    steps:
      - name: Ping a la edge function (${{ matrix.fn }})
        shell: bash
        run: |
          CODE="$(curl -sS --max-time 30 -o /dev/null -w '%{http_code}' "$FUN_URL")"
          echo "${{ matrix.fn }} -> $CODE"
          if [ "$CODE" = "200" ]; then
            echo "la funcion respondio 200 sin auth (no deberia)"
            exit 1
          fi