name: keepalive worker

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Pinger al worker (evita el sleep de Render Free)
        shell: bash
        run: |
          URL="${WORKER_URL%/}/status"
          if curl -fsS --max-time 25 -o /dev/null "$URL"; then
            echo "worker OK"
          else
            echo "usando indice (recien despierto)"
            curl -fsS --max-time 40 -o /dev/null "${WORKER_URL%/}/"
          fi
        env:
          WORKER_URL: ${{ vars.WORKER_URL }}