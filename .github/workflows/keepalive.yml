name: keepalive edge functions

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  warm-functions:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        fn: [rates, clients, settings, qr, auth, export]
    env:
      # Sin sesion, las funciones responden 401 pero la instancia queda caliente.
      FUN_URL: https://adelljptewdngtnljohu.supabase.co/functions/v1/${{ matrix.fn }}
    steps:
      - name: Ping a la edge function (${{ matrix.fn }})
        shell: bash
        run: |
          CODE="$(curl -sS --max-time 30 -o /dev/null -w '%{http_code}' "$FUN_URL")"
          echo "${{ matrix.fn }} -> $CODE"
          if [ "$CODE" = "200" ]; then
            echo "la funcion respondio 200 sin auth (no deberia)"
            exit 1
          fi