name: Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'client/**'
      - '.github/workflows/android-build.yml'

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Installar dependencias
        run: npm ci

      - name: Compilar web y sincronizar Capacitor
        run: npm run build:app -w client

      - name: Compilar APK Release
        working-directory: client/android
        run: ./gradlew assembleRelease

      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: mis-cuentas-apk
          path: client/android/app/build/outputs/apk/release
          if-no-files-found: error

      - name: Publicar/actualizar Release del APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create apk-latest \
            client/android/app/build/outputs/apk/release/*.apk \
            --target "${{ github.sha }}" \
            --title "APK Release" --notes "APK actualizado en cada push a main." \
          || gh release upload apk-latest \
            client/android/app/build/outputs/apk/release/*.apk \
            --clobber